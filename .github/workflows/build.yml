name: build

on:
  push:
  pull_request:

jobs:
  compile:
    # GitHub-hosted runners have no GPU, so this job only compiles every
    # example. Run `make test` and `make sanitize` on a machine with an
    # NVIDIA GPU to execute and validate them.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.8.1", "13.3.1"]
    container: nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CMake and Ninja
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CUDA_ARCHITECTURES="75;80;90"
      - name: Build
        run: cmake --build build

  visualizations:
    # Every inline script must parse, external scripts may only come from an
    # allowlist of CDNs (polyfill.io was taken over in 2024 and served
    # malicious JavaScript), and local links must resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the HTML visualizations
        run: node tools/check_visualizations.mjs

  tools:
    # The benchmark and roofline scripts run on GPU machines; make sure they at
    # least parse and show their help here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Python tools
        run: |
          python3 -m py_compile tools/bench.py tools/roofline.py docs/generate_pptx.py ml/pytorch_extension/test_lab_ops.py
          python3 tools/bench.py --help > /dev/null
          python3 tools/roofline.py --help > /dev/null
